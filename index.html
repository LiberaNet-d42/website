<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS4242421323 — Under Construction</title>
<style>
  :root{
    --bg:#0a0e14;
    --bg-2:#0d1220;
    --accent:#5eead4;
    --accent-2:#818cf8;
    --text:#e5e7eb;
    --muted:#6b7280;
    --border:rgba(255,255,255,0.08);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* Network-style background grid */
  .grid-bg{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(94,234,212,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,234,212,0.05) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 40%, black 20%, transparent 75%);
    animation:drift 40s linear infinite;
  }

  @keyframes drift{
    from{background-position:0 0, 0 0;}
    to{background-position:48px 48px, 48px 48px;}
  }

  .glow{
    position:fixed;
    width:600px;
    height:600px;
    background:radial-gradient(circle, rgba(94,234,212,0.12), transparent 70%);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    filter:blur(20px);
  }

  .container{
    position:relative;
    z-index:2;
    text-align:center;
    padding:40px;
    max-width:560px;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    border:1px solid var(--border);
    border-radius:999px;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:32px;
    background:rgba(255,255,255,0.02);
  }

  .badge .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    animation:pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.4; transform:scale(0.7);}
  }

  /* Loader — orbital ring */
  .loader{
    position:relative;
    width:96px;
    height:96px;
    margin:0 auto 40px;
  }

  .loader span{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid transparent;
  }

  .loader span:nth-child(1){
    border-top-color:var(--accent);
    animation:spin 1.6s cubic-bezier(0.5,0,0.5,1) infinite;
  }

  .loader span:nth-child(2){
    inset:14px;
    border-top-color:var(--accent-2);
    animation:spin 1.1s cubic-bezier(0.5,0,0.5,1) infinite reverse;
  }

  @keyframes spin{
    to{transform:rotate(360deg);}
  }

  h1{
    font-size:28px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin-bottom:12px;
    background:linear-gradient(90deg, var(--text), var(--muted));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  p.sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin-bottom:36px;
  }

  .info{
    display:flex;
    justify-content:center;
    gap:0;
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    background:rgba(255,255,255,0.015);
    backdrop-filter:blur(8px);
  }

  .info div{
    padding:16px 24px;
    flex:1;
    border-right:1px solid var(--border);
  }

  .info div:last-child{border-right:none;}

  .info .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--muted);
    margin-bottom:6px;
  }

  .info .value{
    font-size:14px;
    font-family:'SF Mono', 'Fira Code', monospace;
    color:var(--accent);
    font-weight:500;
  }

  footer{
    margin-top:36px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  footer span{color:var(--accent-2);}

  @media (max-width:480px){
    .info{flex-direction:column;}
    .info div{border-right:none; border-bottom:1px solid var(--border);}
    .info div:last-child{border-bottom:none;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="container">
    <div class="badge"><span class="dot"></span> dn42 Network</div>

    <div class="loader">
      <span></span>
      <span></span>
    </div>

    <h1>Under Construction</h1>
    <p class="sub">
      This AS's infrastructure is currently being deployed.<br>
      BGP announcements and related services will be available soon.
    </p>

    <div class="info">
      <div>
        <div class="label">ASN</div>
        <div class="value">AS4242421323</div>
      </div>
      <div>
        <div class="label">Network</div>
        <div class="value">dn42</div>
      </div>
      <div>
        <div class="label">Status</div>
        <div class="value">Deploying</div>
      </div>
    </div>

    <footer>Powered by <span>dn42</span> — the decentralized network</footer>
  </div>

</body>
</html>
