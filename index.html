<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIBERANET — Network deploying</title>
<meta name="description" content="LIBERANET — this network is being deployed. Services will be available soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --ink: #12151C;
    --ink-muted: #5B6472;
    --ink-faint: #8B93A1;
    --border: rgba(18,21,28,0.09);
    --border-strong: rgba(18,21,28,0.16);
    --accent: #3654FF;
    --accent-soft: rgba(54,84,255,0.10);
    --accent-ink: #1E33CC;
    --ok: #178A5B;
    --ok-soft: rgba(31,170,109,0.12);
    --grid-line: rgba(18,21,28,0.05);
  }

  *{ box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display:flex; flex-direction:column;
    position: relative;
    overflow-x:hidden;
  }
  ::selection{ background: var(--accent); color:#fff; }

  body::before{
    content:""; position:fixed; inset:0; z-index:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(ellipse 55% 45% at 50% 38%, var(--accent-soft), transparent 70%);
  }

  header{
    position:relative; z-index:1;
    display:flex; align-items:center; justify-content:center;
    padding: 28px 40px;
  }
  @media (max-width:640px){ header{ padding: 22px 22px; } }

  .brand{ display:flex; align-items:center; gap:10px; font-family:'Space Grotesk'; font-weight:700; font-size: 1.05rem; }
  .brand-mark{
    width: 24px; height:24px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-ink));
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .brand-mark::after{ content:""; position:absolute; width:8px; height:8px; border-radius:50%; background:#fff; opacity:.92; }
  .brand .asn{ color: var(--ink-faint); font-family:'JetBrains Mono'; font-weight:500; font-size:.78rem; }

  main{
    position:relative; z-index:1; flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 40px 24px 60px;
  }

  .glyph{ margin-bottom: 34px; }
  .glyph svg{ width: 180px; height:auto; }
  .glyph-ring{ fill:none; stroke: var(--border-strong); stroke-width:1; }
  .glyph-ring.animated{
    stroke: var(--accent); stroke-dasharray: 6 8; opacity:.6;
    animation: rotate 14s linear infinite;
    transform-origin: 90px 90px;
  }
  @keyframes rotate{ to{ transform: rotate(360deg); } }
  .glyph-core{ fill: var(--surface); stroke: var(--ink); stroke-width:1.4; }
  .glyph-dot{ fill: var(--accent); }

  h1{
    font-family:'Space Grotesk'; font-weight:600; letter-spacing:-0.02em;
    font-size: clamp(1.9rem, 3.4vw + 1rem, 2.9rem);
    max-width: 680px; line-height:1.15; margin:0;
  }
  h1 em{ font-style:normal; color: var(--accent); }

  p.lead{
    margin: 20px 0 0; max-width: 520px; color: var(--ink-muted);
    font-size: 1.04rem; line-height:1.6;
  }

  footer{
    position:relative; z-index:1;
    text-align:center; padding: 26px 24px 32px;
    font-family:'JetBrains Mono'; font-size:.76rem; color: var(--ink-faint);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    LIBERANET <span class="asn">AS4242421323</span>
  </div>
</header>

<main>
  <div class="glyph" aria-hidden="true">
    <svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
      <circle class="glyph-ring" cx="90" cy="90" r="70"/>
      <circle class="glyph-ring animated" cx="90" cy="90" r="56"/>
      <circle class="glyph-dot" cx="90" cy="20" r="3.5"/>
      <circle class="glyph-dot" cx="160" cy="90" r="3.5"/>
      <circle class="glyph-dot" cx="90" cy="160" r="3.5"/>
      <circle class="glyph-dot" cx="20" cy="90" r="3.5"/>
    </svg>
  </div>

  <h1>This network is <em>being deployed.</em></h1>
  <p class="lead">LIBERANET's infrastructure is currently being built out across our PoPs. Services will be available soon — thank you for your patience.</p>
</main>

<footer>LIBERANET — AS4242421323 · © 2026</footer>

</body>
</html>
